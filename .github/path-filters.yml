# Which expensive CI/CD jobs run for a change.
# Used by dorny/paths-filter in ci.yml, cd.yml, docs.yml and terraform.yml
# (predicate-quantifier: some-with-excludes). Keep the pipeline diagrams in
# docs/architecture.md and docs/runbook.md in sync.
#
# Patterns are picomatch globs: `*` stays inside one directory, `**` crosses
# them, a leading `!` excludes. Markdown-only changes match none of check or
# image, so they skip just check, Docker and GHCR. Changing this file itself
# is in every list (fail closed).
#
# check     → just check + just build (ci.yml)
# image     → Docker smoke (ci.yml) and GHCR + Sentry (cd.yml)
# docs      → Biome on docs/ + the VitePress build (docs.yml)
# terraform → just tf-validate (terraform.yml)
# stack     → Azure plans (terraform.yml); markdown under infra/ does not count

check:
  - "src/**"
  - "scripts/**"
  - "tests/**"
  - "content/**"
  - "config/**"
  # vitest.config.ts; Biome lints the rest.
  - "*.ts"
  # package.json, biome.json, tsconfig*.json
  - "*.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "justfile"
  - ".nvmrc"
  # Biome skips what git ignores.
  - ".gitignore"
  - "Dockerfile"
  # Fail closed: a workflow or filter change still runs just check.
  - ".github/workflows/**"
  - ".github/path-filters.yml"
  # tests/scripts/secrets-manifest.test.ts checks these against infra/secrets.manifest.yaml (ADR 0015).
  - "infra/secrets.manifest.yaml"
  - "infra/modules/pixel/*.tf"
  - "infra/envs/*/*.tf"
  - ".env.example"
  - "docs/runbook.md"
  - "docs/architecture.md"
  - "docs/infra.md"

# What the Dockerfile copies. Tests live in tests/, outside src/, so they never reach the image.
image:
  - "src/**"
  - "!src/testing/**"
  - "content/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "tsconfig.json"
  - "tsconfig.build.json"
  - "Dockerfile"
  - ".dockerignore"
  - ".github/path-filters.yml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/cd.yml"

# The site, plus the root package.json (its version is in the nav, and Biome
# comes from the root install). docs.yml's paths trigger must list these too.
docs:
  - "docs/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "biome.json"
  - ".gitignore"
  - ".nvmrc"
  - "justfile"
  - ".github/workflows/docs.yml"
  - ".github/path-filters.yml"

# Markdown under infra/ does not change the stack. terraform.yml's paths
# trigger must list the positive patterns too, so the workflow still starts
# for infra markdown; the inner filter then skips validate.
terraform:
  - "infra/**"
  - "!infra/**/*.md"
  - "justfile"
  - ".github/workflows/terraform.yml"
  - ".github/path-filters.yml"

# Azure plans only. justfile / workflow / filter edits validate but do not plan.
stack:
  - "infra/**"
  - "!infra/**/*.md"
