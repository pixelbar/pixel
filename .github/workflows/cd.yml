name: CD

# Temporary routing (ADR 0010, #10): merges to `main` publish GHCR only.
# Azure `dev` is a local build (`just deploy-dev`), not CI. Prod CD is
# disabled until #12 and prod Key Vault secrets exist — this workflow has
# no path to pixel-prod and never copies pixel-dev / Mini Discord tokens.

on:
  push:
    branches: [main]

# Least privilege at the workflow level. The publish job is the only one that
# writes packages. Nothing here gets id-token: write (that would be prod Azure).
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin},${IMAGE_NAME}:main"
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets or access lists
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env || test -e /app/config/admins.yaml || test -e /app/config/members.yaml'; then
            echo "::error::Image ${PIN} contains .env or access lists. Do not deploy it."
            exit 1
          fi
          echo "No .env or access lists in ${PIN}."

      - name: Make GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Azure Container Apps cannot pull a private ghcr.io/pixelbar/pixel
          # image (401 / DENIED). Public is the intended fix; the image has no
          # secrets. This token may lack package-admin; then a maintainer must
          # flip visibility in the GitHub UI.
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "${package}" \
              -f visibility=public; then
              echo "Package ${{ github.repository }} is public."
              exit 0
            fi
            echo "Visibility update failed (attempt ${attempt}); waiting for the package to exist."
            sleep 5
          done
          echo "::warning::Could not set ghcr.io/${{ github.repository }} public from this job. A maintainer must: GitHub → Packages → pixel → Package settings → Change visibility → Public. Until then Azure pulls 401."

  sentry-release:
    name: Sentry release (source maps)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Skip until Sentry org and token are set
        if: env.SENTRY_AUTH_TOKEN == '' || env.SENTRY_ORG == '' || env.SENTRY_PROJECT == ''
        run: |
          echo "::notice::Sentry release skipped. Set secret SENTRY_AUTH_TOKEN and repository variables SENTRY_ORG and SENTRY_PROJECT (architecture still asks which org). ${{ needs.publish.outputs.image }} was published. Not inventing an org. Prod was not deployed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''

      - name: Install and compile (source maps)
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        run: |
          pnpm install --frozen-lockfile
          just build

      - name: Create Sentry release and upload source maps
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        with:
          # No environment: this job is publish-only. Prod CD is off until #12.
          release: ${{ github.sha }}
          sourcemaps: dist
          inject: false
          url_prefix: /app/dist
          set_commits: auto
          ignore_missing: true
          disable_telemetry: true

  prod-cd:
    name: Prod CD (disabled until #12)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Do not deploy to prod
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          echo "Prod CD is disabled until #12 and prod Key Vault secrets exist."
          echo "Published ${IMAGE}. Did not log in to Azure. Did not update pixel-prod."
          echo "Fail closed: this workflow has no path to the prod Container App."
          echo "Never copy pixel-dev-kv / Mini Discord token (bot 1555857000049541231) into prod."
          echo "Azure dev stays just deploy-dev (one replica). Do not also just dev on that token."
