name: CD

# Merges to `main` publish GHCR, upload Sentry maps, then roll pixel-prod
# to that same digest after GitHub Environment `prod` approval (ADR 0012).
# Azure `dev` stays a local build (`just deploy-dev`). Never copy pixel-dev
# / Mini Discord tokens into prod. This workflow does not apply Terraform.

on:
  push:
    branches: [main]

# Least privilege at the workflow level. The publish job is the only one that
# writes packages. Prod CD is the only job with id-token: write (Environment prod).
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin},${IMAGE_NAME}:main"
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets or access lists
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env || test -e /app/config/admins.yaml || test -e /app/config/members.yaml'; then
            echo "::error::Image ${PIN} contains .env or access lists. Do not deploy it."
            exit 1
          fi
          echo "No .env or access lists in ${PIN}."

      - name: Make GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Azure Container Apps cannot pull a private ghcr.io/pixelbar/pixel
          # image (401 / DENIED). Public is the intended fix; the image has no
          # secrets. This token may lack package-admin; then a maintainer must
          # flip visibility in the GitHub UI.
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "${package}" \
              -f visibility=public; then
              echo "Package ${{ github.repository }} is public."
              exit 0
            fi
            echo "Visibility update failed (attempt ${attempt}); waiting for the package to exist."
            sleep 5
          done
          echo "::warning::Could not set ghcr.io/${{ github.repository }} public from this job. A maintainer must: GitHub → Packages → pixel → Package settings → Change visibility → Public. Until then Azure pulls 401."

  sentry-release:
    name: Sentry release (source maps)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Require Sentry org and token
        run: |
          missing=0
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set (repository secret)."
            missing=1
          fi
          if [ -z "${SENTRY_ORG}" ]; then
            echo "::error::SENTRY_ORG is not set (repository variable)."
            missing=1
          fi
          if [ -z "${SENTRY_PROJECT}" ]; then
            echo "::error::SENTRY_PROJECT is not set (repository variable)."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "Fail closed. ${{ needs.publish.outputs.image }} was published. Sentry maps were not uploaded."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install and compile (source maps)
        run: |
          pnpm install --frozen-lockfile
          just build

      - name: Create Sentry release and upload source maps
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        with:
          # Publish-only. The prod-cd job records the Environment prod deploy.
          release: ${{ github.sha }}
          sourcemaps: dist
          inject: false
          url_prefix: /app/dist
          set_commits: auto
          ignore_missing: true
          disable_telemetry: true

  prod-cd:
    name: Deploy prod
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require ARM_* on GitHub Environment prod
        env:
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
        run: |
          missing=0
          if [ -z "${ARM_CLIENT_ID}" ]; then
            echo "::error::ARM_CLIENT_ID is not set on GitHub Environment prod (variable, not secret)."
            missing=1
          fi
          if [ -z "${ARM_TENANT_ID}" ]; then
            echo "::error::ARM_TENANT_ID is not set on GitHub Environment prod."
            missing=1
          fi
          if [ -z "${ARM_SUBSCRIPTION_ID}" ]; then
            echo "::error::ARM_SUBSCRIPTION_ID is not set on GitHub Environment prod."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "Fail closed. Image ${{ needs.publish.outputs.image }} was published. Not inventing credentials. This job does not apply Terraform and does not touch pixel-dev."
            exit 1
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Roll pixel-prod to the published digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          resource_group="pixel-prod"
          app_name="pixel-prod"
          if [ "${resource_group}" != "pixel-prod" ] || [ "${app_name}" != "pixel-prod" ]; then
            echo "Refusing to deploy: this job only updates pixel-prod, never pixel-dev."
            exit 1
          fi
          if ! az containerapp show -g "${resource_group}" -n "${app_name}" >/dev/null 2>&1; then
            echo "::error::Container App ${app_name} is not in ${resource_group} yet. A maintainer applies infra/envs/prod (PIXEL_APPLY_PROD=1). This job does not apply Terraform."
            exit 1
          fi
          az containerapp update \
            -g "${resource_group}" \
            -n "${app_name}" \
            --image "${IMAGE}" \
            --min-replicas 1 \
            --max-replicas 1
          running="$(az containerapp show -g "${resource_group}" -n "${app_name}" --query "properties.template.containers[0].image" -o tsv)"
          min="$(az containerapp show -g "${resource_group}" -n "${app_name}" --query "properties.template.scale.minReplicas" -o tsv)"
          max="$(az containerapp show -g "${resource_group}" -n "${app_name}" --query "properties.template.scale.maxReplicas" -o tsv)"
          echo "Running ${running} min=${min} max=${max}"
          if [ "${max}" != "1" ] || [ "${min}" != "1" ]; then
            echo "Replica count is not 1 (min=${min} max=${max}). Two bots on one token would answer twice."
            exit 1
          fi
          echo "Rolled ${IMAGE}. Register slash commands with a prod .env (never the Mini Pixel Dev token): just register."
          echo "Never copy pixel-dev-kv / Mini Discord tokens into prod."
