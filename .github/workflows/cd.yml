name: CD

# Merges to `main` publish GHCR and upload Sentry maps when an image path
# changed (dorny/paths-filter + .github/path-filters.yml). They do **not**
# roll pixel-prod (ADR 0013): that is the Release workflow. Docs / changelog /
# infra-only merges skip this pipeline. Azure `dev` stays a local build
# (`just deploy-dev`). Never copy pixel-dev / Mini Discord tokens into prod.
# This workflow does not apply Terraform.

on:
  push:
    branches: [main]

# Least privilege at the workflow level. The publish job is the only one that
# writes packages. Nothing here gets id-token: write (that is the Release
# workflow's prod job).
permissions:
  contents: read

# Queue, never cancel: cancelling a run mid-publish (say, for a docs-only
# merge right after it) left that commit with no GHCR image and no Sentry
# release. GitHub still keeps only one pending run and replaces it with a
# newer push, so the path filter below compares against the last green run,
# not just the previous push, and a replaced run's changes are not lost.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # actions: read lists earlier CD runs to find the last green one.
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A run is green only if it published whatever needed publishing, so
      # everything after its commit is still unpublished. Falls back to the
      # previous push when there is no green run, or it is not in main's history.
      - name: Last green CD commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          last="$(gh api "repos/${REPO}/actions/workflows/cd.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' || true)"
          if [ -n "${last}" ] && [ "${last}" != "${GITHUB_SHA}" ] && git merge-base --is-ancestor "${last}" HEAD; then
            base="${last}"
          else
            base="${BEFORE}"
          fi
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"
          echo "Image paths are compared against ${base}."

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: .github/path-filters.yml

  publish:
    name: Publish GHCR
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin},${IMAGE_NAME}:main"
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets or access lists
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env || test -e /app/config/admins.yaml || test -e /app/config/members.yaml'; then
            echo "::error::Image ${PIN} contains .env or access lists. Do not deploy it."
            exit 1
          fi
          echo "No .env or access lists in ${PIN}."

      - name: Make GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Azure Container Apps cannot pull a private ghcr.io/pixelbar/pixel
          # image (401 / DENIED). Public is the intended fix; the image has no
          # secrets. This token may lack package-admin; then a maintainer must
          # flip visibility in the GitHub UI.
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "${package}" \
              -f visibility=public; then
              echo "Package ${{ github.repository }} is public."
              exit 0
            fi
            echo "Visibility update failed (attempt ${attempt}); waiting for the package to exist."
            sleep 5
          done
          echo "::warning::Could not set ghcr.io/${{ github.repository }} public from this job. A maintainer must: GitHub → Packages → pixel → Package settings → Change visibility → Public. Until then Azure pulls 401."

  sentry-release:
    name: Sentry release (source maps)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Require Sentry org and token
        run: |
          missing=0
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set (repository secret)."
            missing=1
          fi
          if [ -z "${SENTRY_ORG}" ]; then
            echo "::error::SENTRY_ORG is not set (repository variable)."
            missing=1
          fi
          if [ -z "${SENTRY_PROJECT}" ]; then
            echo "::error::SENTRY_PROJECT is not set (repository variable)."
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "Fail closed. ${{ needs.publish.outputs.image }} was published. Sentry maps were not uploaded."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install and compile (source maps)
        run: |
          pnpm install --frozen-lockfile
          just build

      - name: Create Sentry release and upload source maps
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3.7.1
        with:
          # Publish-only. Prod deploys (and the Sentry prod environment) are
          # the Release workflow.
          release: ${{ github.sha }}
          sourcemaps: dist
          inject: false
          url_prefix: /app/dist
          set_commits: auto
          ignore_missing: true
          disable_telemetry: true
