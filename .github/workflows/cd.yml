name: CD

# Temporary routing (ADR 0010, #10): pull requests publish a GHCR image and
# deploy that SHA to Azure `dev`. Merges to `main` publish and deploy to prod.
# Prod is fail-closed until infra/envs/prod and prod Key Vault secrets exist.
# This workflow never copies pixel-dev (or Mini local) Discord tokens into prod.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level. The publish job is the only one that
# writes packages. Deploy jobs get id-token: write for Azure OIDC.
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish GHCR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pin="${IMAGE_NAME}:${SHA}"
          tags="${pin}"
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            tags="${tags},${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi
          if [ "${REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE_NAME}:main"
          fi
          echo "pin=${pin}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${tags}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fail if the image contains secrets or access lists
        env:
          PIN: ${{ steps.meta.outputs.pin }}
        run: |
          docker pull "${PIN}"
          if docker run --rm --entrypoint sh "${PIN}" -c 'test -e /app/.env || test -e /app/config/admins.yaml || test -e /app/config/members.yaml'; then
            echo "::error::Image ${PIN} contains .env or access lists. Do not deploy it."
            exit 1
          fi
          echo "No .env or access lists in ${PIN}."

      - name: Make GHCR package public (no secrets in the image)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Azure Container Apps cannot pull a private ghcr.io/pixelbar/pixel
          # image (401 / DENIED). Public is the intended fix; the image has no
          # secrets. This token may lack package-admin; then a maintainer must
          # flip visibility in the GitHub UI.
          package="/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}"
          for attempt in 1 2 3 4 5; do
            if gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "${package}" \
              -f visibility=public; then
              echo "Package ${{ github.repository }} is public."
              exit 0
            fi
            echo "Visibility update failed (attempt ${attempt}); waiting for the package to exist."
            sleep 5
          done
          echo "::warning::Could not set ghcr.io/${{ github.repository }} public from this job. A maintainer must: GitHub → Packages → pixel → Package settings → Change visibility → Public. Until then Azure pulls 401."

  deploy-dev:
    name: Deploy Azure dev
    needs: publish
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-pixel-dev
      cancel-in-progress: true
    steps:
      - name: Skip until GitHub Environment dev has ARM_* variables
        if: vars.ARM_CLIENT_ID == ''
        run: |
          echo "ARM_CLIENT_ID is not set on GitHub Environment dev. Image ${{ needs.publish.outputs.image }} was published. Azure deploy skipped; not inventing credentials."
          echo "Set ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID as environment variables (not secrets). Values: infra/bootstrap README (client id 8cb13b94-5941-4788-8071-9f1ba80dada8)."

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: vars.ARM_CLIENT_ID != ''
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Update pixel-dev to this SHA (one replica)
        if: vars.ARM_CLIENT_ID != ''
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          RESOURCE_GROUP: pixel-dev
          APP_NAME: pixel-dev
        run: |
          set -euo pipefail
          if ! az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" >/dev/null 2>&1; then
            echo "::error::Container App ${APP_NAME} is not in ${RESOURCE_GROUP} yet (#9). Image ${IMAGE} was published. Apply infra/envs/dev (PR 66), then re-run this workflow. This job does not apply Terraform."
            exit 1
          fi
          az containerapp update \
            -g "${RESOURCE_GROUP}" \
            -n "${APP_NAME}" \
            --image "${IMAGE}" \
            --min-replicas 1 \
            --max-replicas 1
          image=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.containers[0].image" -o tsv)
          min=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.scale.minReplicas" -o tsv)
          max=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.scale.maxReplicas" -o tsv)
          echo "Running ${image} min=${min} max=${max}"
          if [ "${max}" != "1" ] || [ "${min}" != "1" ]; then
            echo "::error::Replica count is not 1 (min=${min} max=${max}). Two bots on one token would answer twice. Not leaving it this way."
            exit 1
          fi
          case "${image}" in
            *"${{ github.sha }}"*) ;;
            *)
              echo "::error::Container App image is ${image}, expected SHA ${{ github.sha }}."
              exit 1
              ;;
          esac

  prod-preflight:
    name: Prod preflight (fail closed)
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require prod Terraform and refuse a Mini/dev token
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          missing=0
          if [ ! -d infra/envs/prod ] || [ ! -f infra/envs/prod/main.tf ]; then
            echo "::error::infra/envs/prod is missing (#12). ${IMAGE} was published. Prod was NOT deployed. Discord will not answer on prod."
            missing=1
          fi
          if [ -d infra/envs/dev ] && [ -d infra/envs/prod ]; then
            if cmp -s infra/envs/dev/terraform.example.tfvars infra/envs/prod/terraform.example.tfvars 2>/dev/null; then
              echo "::error::prod tfvars match dev. Prod must not reuse the Mini/Pixel Dev Discord application or token."
              missing=1
            fi
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "Fail closed. Do not copy pixel-dev-kv discord-token (Pixel Dev / Mini local bot 1555857000049541231) into prod."
            exit 1
          fi
          echo "infra/envs/prod is present. Deploy job will still fail closed if ARM_* or prod Key Vault secrets are missing."

  deploy-prod:
    name: Deploy Azure prod
    needs: [publish, prod-preflight]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: azure-pixel-prod
      cancel-in-progress: false
    steps:
      - name: Skip until GitHub Environment prod has ARM_* variables
        if: vars.ARM_CLIENT_ID == ''
        run: |
          echo "::error::ARM_CLIENT_ID is not set on GitHub Environment prod. ${{ needs.publish.outputs.image }} was published. Prod was NOT deployed. Create Environment prod (reviewers, branch main) and set ARM_CLIENT_ID 7cb1d0a8-5314-4c9b-a0ba-10f5c75367d7, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID as variables. Not inventing credentials."
          exit 1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: vars.ARM_CLIENT_ID != ''
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Update pixel-prod to this SHA (fail closed, one replica)
        if: vars.ARM_CLIENT_ID != ''
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          RESOURCE_GROUP: pixel-prod
          APP_NAME: pixel-prod
          KEY_VAULT: pixel-prod-kv
        run: |
          set -euo pipefail
          if [ "${RESOURCE_GROUP}" = "pixel-dev" ] || [ "${KEY_VAULT}" = "pixel-dev-kv" ] || [ "${APP_NAME}" = "pixel-dev" ]; then
            echo "::error::Refusing to deploy prod using the dev resource group, app, or vault. Mini/dev Discord token must not go to prod."
            exit 1
          fi
          if ! az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" >/dev/null 2>&1; then
            echo "::error::Container App ${APP_NAME} is not in ${RESOURCE_GROUP} (#12). ${IMAGE} was published. Prod was NOT deployed. Discord will not answer on prod."
            exit 1
          fi
          if ! az keyvault show --name "${KEY_VAULT}" >/dev/null 2>&1; then
            echo "::error::Key Vault ${KEY_VAULT} is missing (#12). ${IMAGE} was published. Prod was NOT deployed."
            exit 1
          fi
          if ! az keyvault secret show --vault-name "${KEY_VAULT}" --name discord-token --query name -o tsv >/dev/null 2>&1; then
            echo "::error::Key Vault ${KEY_VAULT} has no discord-token. Prod secrets are missing. Not copying pixel-dev-kv or the Mini local token. Prod was NOT deployed."
            exit 1
          fi
          if ! az keyvault secret show --vault-name "${KEY_VAULT}" --name admins-yaml --query name -o tsv >/dev/null 2>&1; then
            echo "::error::Key Vault ${KEY_VAULT} has no admins-yaml. Prod secrets are missing. Prod was NOT deployed."
            exit 1
          fi
          az containerapp update \
            -g "${RESOURCE_GROUP}" \
            -n "${APP_NAME}" \
            --image "${IMAGE}" \
            --min-replicas 1 \
            --max-replicas 1
          image=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.containers[0].image" -o tsv)
          min=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.scale.minReplicas" -o tsv)
          max=$(az containerapp show -g "${RESOURCE_GROUP}" -n "${APP_NAME}" --query "properties.template.scale.maxReplicas" -o tsv)
          echo "Running ${image} min=${min} max=${max}"
          if [ "${max}" != "1" ] || [ "${min}" != "1" ]; then
            echo "::error::Replica count is not 1 (min=${min} max=${max}). Two bots on one token would answer twice."
            exit 1
          fi
          case "${image}" in
            *"${{ github.sha }}"*) ;;
            *)
              echo "::error::Container App image is ${image}, expected SHA ${{ github.sha }}."
              exit 1
              ;;
          esac
