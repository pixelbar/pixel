name: CI

# just check and the Docker smoke build each run only when their inputs (lists
# in .github/path-filters.yml) changed, via dorny/paths-filter. A markdown-only
# PR skips them: skipped jobs never start a runner, and GitHub shows them as
# passed. Fail closed: src/, lockfile, workflows, Dockerfile, justfile, config/
# and content/info/ still run the matching job; if the filter job fails, the
# expensive jobs run.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI reads the repo. pull-requests: read is for dorny's PR
# files API (ignored on push).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      check: ${{ steps.filter.outputs.check }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: some-with-excludes

  check:
    name: Lint, typecheck, test, build
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.check == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test with coverage thresholds
        run: just check

      - name: Build
        run: just build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  docker:
    name: Docker image builds
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
