name: CI

# just check and the Docker smoke build each run only when their inputs
# changed (dorny/paths-filter + .github/path-filters.yml). Jobs always start
# so required checks stay green when that job is not needed.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo and (on PRs) the changed-files API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (with the version in a comment) so a
# moved or compromised tag can't change what runs here.

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      check: ${{ steps.filter.outputs.check }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      # Needed on push to main (git against the previous commit). Harmless on PRs
      # where dorny uses the pull-request files API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  check:
    name: Lint, typecheck, test, build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip just check
        if: needs.changes.outputs.check != 'true'
        run: echo "Skipping just check; no check path changed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.check == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        if: needs.changes.outputs.check == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.check == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: needs.changes.outputs.check == 'true'

      - name: Install dependencies
        if: needs.changes.outputs.check == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test with coverage thresholds
        if: needs.changes.outputs.check == 'true'
        run: just check

      - name: Build
        if: needs.changes.outputs.check == 'true'
        run: just build

      - name: Upload coverage report
        if: ${{ !cancelled() && needs.changes.outputs.check == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  docker:
    name: Docker image builds
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip Docker image
        if: needs.changes.outputs.image != 'true'
        run: echo "Skipping Docker; no image path changed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.image == 'true'
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.image == 'true'

      - name: Build image (not pushed)
        if: needs.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            PIXEL_VERSION=${{ github.sha }}
            PIXEL_GIT_SHA=${{ github.sha }}
            PIXEL_GIT_BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
