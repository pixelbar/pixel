# Every secret Pixel's hosting keeps in Azure Key Vault. NAMES AND METADATA ONLY: never a value.
#
# This file is the single source of truth for which secrets exist, what each is called in
# Key Vault, which environment variable carries it, and when it applies. Read by:
#   - infra/modules/pixel/locals.tf  (which secrets a stack needs, and the app's secret env vars)
#   - scripts/secrets-manifest.ts    (validation, and just secrets-pull / secrets-push: ADR 0016)
#   - scripts/secrets-manifest.test.ts, which fails when this file, config.ts, .env.example,
#     the Terraform variables or the runbook disagree. See ADR 0015.
#
# To add a secret: add an entry here, add the setting to src/config.ts and .env.example,
# and describe it in docs/runbook.md. An infra-group secret also needs its Terraform
# variable and write-only entry (infra/modules/pixel/secrets.tf, both envs); an app one
# must not have them (ADR 0017). The test names whatever you missed.

version: 1

# A feature decides whether a stack needs the secret. Terraform maps each name to a
# condition in `secret_features` (infra/modules/pixel/locals.tf). `always` is built in.
features:
  always: Every stack
  home-assistant: Home Assistant control (HOME_ASSISTANT_URL is set)
  mastodon: Mastodon announcements (MASTODON_INSTANCE is set)
  spacestate: /spacestate (SPACESTATE_API_URL is set)
  sentry: Sentry error reporting (sentry_enabled)
  tailscale: Tailscale sidecar (tailscale_enabled)
  container-registry: Private image registry (container_registry_server is set)

# group
#   app      belongs to the Pixel app. Only just secrets-push / just push write these (ADR 0017);
#            Terraform references them from the Container App but never writes them.
#   infra    belongs to the platform around the app. Terraform writes these (write_secrets).
#   tooling  read only by the laptop tools (just pull / just push). Terraform and the Container
#            App never see these: Terraform skips the group, so the app can't reference them.
# delivery
#   env          the Container App passes it to Pixel as the environment variable `env`
#   file         mounted into Pixel as a file (see PIXEL_ADMINS_FILE)
#   sidecar-env  passed to the Tailscale sidecar as the environment variable `env`
#   registry     used by the Container App to pull the image
#   tool         read and written only by just pull / just push (the tooling group)
secrets:
  - vault: discord-token
    group: app
    delivery: env
    env: DISCORD_TOKEN
    feature: always
    description: The Discord bot token for this environment's application.

  - vault: admins-yaml
    group: app
    delivery: file
    feature: always
    description: The admin access list (admins.yaml), mounted as a file.

  - vault: home-assistant-token
    group: app
    delivery: env
    env: HOME_ASSISTANT_TOKEN
    feature: home-assistant
    description: A long-lived access token from a non-admin Home Assistant user.

  - vault: mastodon-access-token
    group: app
    delivery: env
    env: MASTODON_ACCESS_TOKEN
    feature: mastodon
    description: A Mastodon access token with write:statuses only.

  - vault: spacestate-user
    group: app
    delivery: env
    env: SPACESTATE_USER
    feature: spacestate
    description: The user the space state API expects.

  - vault: spacestate-token
    group: app
    delivery: env
    env: SPACESTATE_TOKEN
    feature: spacestate
    description: The token the space state API expects.

  - vault: sentry-dsn
    group: app
    delivery: env
    env: SENTRY_DSN
    feature: sentry
    description: The Sentry project's DSN.

  - vault: tailscale-auth-key
    group: infra
    delivery: sidecar-env
    env: TS_AUTHKEY
    feature: tailscale
    description: A tagged Tailscale auth key for the sidecar.

  - vault: ghcr-pull-token
    group: infra
    delivery: registry
    feature: container-registry
    description: A read:packages token for pulling the image from a private registry.

  - vault: terraform-tfvars
    group: tooling
    delivery: tool
    feature: always
    description: The stack's terraform.tfvars (settings, no secret values), shared by just pull / just push.
