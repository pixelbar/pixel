# Pixel admins: full control of the bot.
#
# Copy to config/admins.yaml (gitignored — it contains personal data).
#
# Same shape as members.yaml: each entry has an `id`, which is the platform and
# the user ID ("discord:<id>"), so other platforms can be told apart later.
# Every admin ALSO needs an entry in members.yaml with the same id (their
# membership level, capabilities and a note), so admins are members as well as
# admins. Pixel refuses to start if one is missing.
#
# To find a Discord ID: enable Developer Mode in Discord settings,
# right-click the user and choose "Copy User ID".
#
# IDs MUST be quoted strings. Unquoted numbers lose precision and Pixel will
# refuse to start.
admins:
  - id: "discord:100000000000000001"
